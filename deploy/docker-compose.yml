# Produção (VM Oracle Cloud): api + Caddy (HTTPS automático via Let's Encrypt).
# Rodar a partir da raiz do repo: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: src/Vivarium.Api/Dockerfile
    environment:
      ConnectionStrings__Vivarium: "${CONNECTIONSTRINGS__VIVARIUM}"
      Jwt__Key: "${JWT__KEY}"
      Cors__AllowedOrigins__0: "https://${FRONTEND_DOMAIN}"
      ForwardedHeaders__Enabled: "true"
    restart: unless-stopped
    # sem "ports" — só acessível via Caddy, na rede interna do compose.

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: "${API_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
