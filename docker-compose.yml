# Dev local com Postgres + API em container.
# Producao (Oracle Cloud): so o servico api, apontando pro Neon via env vars.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vivarium
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/Vivarium.Api/Dockerfile
    environment:
      ConnectionStrings__Vivarium: "Host=db;Database=vivarium;Username=postgres;Password=postgres"
      Jwt__Key: "chave-de-dev-nao-usar-em-producao-vivarium-0123456789"
      Jwt__Issuer: vivarium
      Jwt__Audience: vivarium
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
